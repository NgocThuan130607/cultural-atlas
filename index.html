<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%230b57d0%22/%3E%3Cpath d=%22M1 8h14M8 1c3 3 3 11 0 14M8 1c-3 3-3 11 0 14%22 stroke=%22%23fff%22 fill=%22none%22/%3E%3C/svg%3E" />
  <title>Atlas of Stories</title>
  <meta name="description" content="Explore famous places through their history, geography and culture before you visit." />
  <script>
    // Apply the saved or system colour theme before the page paints.
    (function () {
      var t = null;
      try { t = localStorage.getItem("atlas-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
</head>
<body class="earth">
  <div id="globe" role="application" aria-label="3D globe. Use the search box or the place list to choose a city."></div>

  <div class="earth-top">
    <div class="searchbar floating" role="search">
      <span class="ms brand-mark" aria-hidden="true">travel_explore</span>
      <input id="search" type="search" placeholder="Search Atlas of Stories" autocomplete="off" spellcheck="false"
        role="combobox" aria-label="Search cities and landmarks" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" />
      <button class="icon-btn" id="search-clear" type="button" aria-label="Clear search" hidden><span class="ms">close</span></button>
      <span class="icon-btn" aria-hidden="true"><span class="ms">search</span></span>
    </div>
    <ul class="search-results floating" id="search-results" role="listbox" hidden></ul>
  </div>

  <aside class="kcard floating" id="kcard" aria-live="polite"></aside>

  <div class="earth-topright">
    <button class="icon-btn solo" id="layers-btn" type="button" aria-pressed="true" aria-label="Show borders and place names" title="Borders and labels"><span class="ms">layers</span></button>
    <button class="icon-btn solo" id="theme-toggle" type="button" aria-label="Switch colour theme"><span class="ms">dark_mode</span></button>
  </div>

  <div class="earth-controls">
    <button class="icon-btn solo" id="compass" type="button" aria-label="Reset to north" title="Reset to north"><span class="ms fill">navigation</span></button>
    <button class="icon-btn solo" id="tilt-btn" type="button" aria-label="Toggle 3D tilt" title="Toggle 3D view"><span class="tilt-label">3D</span></button>
    <div class="group floating zoom-group">
      <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in"><span class="ms">add</span></button>
      <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out"><span class="ms">remove</span></button>
    </div>
    <button class="icon-btn solo" id="home-btn" type="button" aria-label="Show the whole globe" title="Whole globe"><span class="ms">public</span></button>
  </div>

  <nav class="voyager" id="voyager" aria-label="Featured landmarks"></nav>

  <footer class="earth-status">
    <div class="credits" id="cesium-credits"></div>
    <span class="readout" id="readout" aria-hidden="true"></span>
  </footer>
  <script type="module" src="/src/js/pages/globe.js"></script>
</body>
</html>
